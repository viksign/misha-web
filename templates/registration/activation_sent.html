{% extends 'base.html' %}
{% block title %}Activate your account | MISHA{% endblock %}
{% block content %}
<section class="page-head">

  <h1>Check your email</h1>

<section class="section form-section">
  <a class="button" href="{% url 'login' %}">Return to sign in</a>
</section>
{% endblock %}
