<article class="product-card"><a href="{{ product.get_absolute_url }}" class="product-image" data-product-id="{{ product.pk }}" data-product-name="{{ product.name }}">{% if product.primary_image %}<img src="{{ product.primary_image.image.url }}" alt="{{ product.primary_image.alt_text|default:product.name }}">{% else %}<span>✿</span>{% endif %}</a><div class="product-info"><div><h3>{{ product.name }}</h3><p>{{ product.material }}</p></div><strong>£{{ product.price }}</strong></div></article>
