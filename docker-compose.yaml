services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-djapp}
      MYSQL_USER: ${MYSQL_USER:-djapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-djapp-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-djapp}", "-p${MYSQL_PASSWORD:-djapp-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    working_dir: /app
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,mishaislandheritage.com,www.mishaislandheritage.com}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://mishaislandheritage.com,https://www.mishaislandheritage.com}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-djapp}
      MYSQL_USER: ${MYSQL_USER:-djapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-djapp-password}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    volumes:
      - .:/app
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate
      && gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"

  certbot:
    build: .
    restart: unless-stopped
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_DOMAINS: ${CERTBOT_DOMAINS:-mishaislandheritage.com,www.mishaislandheritage.com}
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - web
    command: >-
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email $${CERTBOT_EMAIL} --agree-tos --no-eff-email --non-interactive
      --keep-until-expiring -d $${CERTBOT_DOMAINS}
      && while :; do certbot renew --quiet; sleep 12h; done"

volumes:
  mysql_data:
  certbot_www:
  letsencrypt:
