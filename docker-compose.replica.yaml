# Standby-host replication clients. Enable with
# COMPOSE_FILE=docker-compose.yaml:docker-compose.standby.yaml:docker-compose.replica.yaml
# in .env. MySQL replicates from the primary through replication-tunnel;
# media-sync mirrors uploaded media every five minutes.
x-replication-tools: &replication-tools
  build:
    context: ./deploy
    dockerfile_inline: |
      FROM alpine:3.21
      RUN apk add --no-cache socat rsync openssh-client mysql-client
  image: misha-web-replication-tools
  restart: unless-stopped

services:
  replication-tunnel:
    <<: *replication-tools
    command:
      - ssh
      - -N
      - -o
      - BatchMode=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=15
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - UserKnownHostsFile=/run/replication/known_hosts
      - -i
      - /run/replication/tunnel_ed25519
      - -L
      - 0.0.0.0:3306:127.0.0.1:3307
      - -L
      - 0.0.0.0:873:127.0.0.1:8730
      - misha-replica@${REPLICATION_PRIMARY_HOST:?REPLICATION_PRIMARY_HOST must be set}
    volumes:
      - ${MISHA_REPLICATION_DIR:?MISHA_REPLICATION_DIR must be set}:/run/replication:ro

  media-sync:
    <<: *replication-tools
    command:
      - sh
      - -c
      - |
        install -m 600 /run/replication/rsync.password /tmp/rsync.password
        while :; do
          if rsync -a --delete --timeout=120 --password-file=/tmp/rsync.password rsync://mediasync@replication-tunnel/media/ /media/; then
            date -u +%FT%TZ > /tmp/last-success
          fi
          sleep 300
        done
    volumes:
      - media_data:/media
      - ${MISHA_REPLICATION_DIR:?MISHA_REPLICATION_DIR must be set}:/run/replication:ro
    depends_on:
      - replication-tunnel
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last-success && [ $$(( $$(date +%s) - $$(date -r /tmp/last-success +%s) )) -lt 900 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
