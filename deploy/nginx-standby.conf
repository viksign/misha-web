server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name mishaislandheritage.com www.mishaislandheritage.com www2.mishaislandheritage.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www2.mishaislandheritage.com;

    ssl_certificate /etc/letsencrypt/live/www2.mishaislandheritage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www2.mishaislandheritage.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "300" always;
    return 503 "The backup site is on standby. Please use https://www.mishaislandheritage.com/.\n";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mishaislandheritage.com www.mishaislandheritage.com;

    ssl_certificate /etc/letsencrypt/live/mishaislandheritage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaislandheritage.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "300" always;
    return 503 "This server is on standby. Please try again later.\n";
}
