# Isolated disaster-recovery drill, run by deploy/dr-drill.sh on the standby.
# A private copy of the shop, loaded from a snapshot of the replica.
# It never touches the replica, live Stripe or real email, and it listens
# only on 127.0.0.1:${DRILL_PORT}.
name: misha-drill

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: djapp
      MYSQL_USER: djapp
      MYSQL_PASSWORD: ${DRILL_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DRILL_DB_PASSWORD:?}
    volumes:
      - drill_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 30

  cache:
    image: redis:7-alpine

  web:
    image: misha-web-web
    env_file:
      - ../../.env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${DRILL_PORT},http://127.0.0.1:${DRILL_PORT}
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      SITE_URL: http://localhost:${DRILL_PORT}
      ORDER_TRACKING_SITE_URL: http://localhost:${DRILL_PORT}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: djapp
      MYSQL_USER: djapp
      MYSQL_PASSWORD: ${DRILL_DB_PASSWORD:?}
      REDIS_URL: redis://cache:6379/1
      # Safety: emails are printed to the log, not sent.
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: ""
      EMAIL_HOST_PASSWORD: ""
      # Safety: Stripe is disabled unless a sk_test_ key is supplied.
      STRIPE_SECRET_KEY: ${DRILL_STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ""
      GUNICORN_WORKERS: "2"
    volumes:
      - drill_media_uploads:/app/media
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/', headers={'Host': 'localhost'}), timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${DRILL_PORT}:80"
    volumes:
      - ./nginx-drill.conf:/etc/nginx/conf.d/default.conf:ro
      - live_media:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  drill_mysql:
  drill_media_uploads:
  live_media:
    external: true
    name: misha-web_media_data
